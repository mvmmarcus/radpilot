# Supabase CLI configuration for local development.
# Only the settings RadPilot depends on are listed; the CLI fills in defaults
# for everything else. Full reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "radpilot"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
